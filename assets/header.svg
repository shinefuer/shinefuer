<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Wu Manruo — high-performance cost-efficient coding agent frameworks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141218"/>
      <stop offset="1" stop-color="#1d1a26"/>
    </linearGradient>
    <linearGradient id="savebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .name { font: 700 44px 'SF Mono','Cascadia Code',Consolas,monospace; fill:#f5f3ef; }
      .caret { fill:#34d399; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }
      .type { clip-path: inset(0 100% 0 0); animation: reveal 2.4s steps(11) 0.3s forwards; }
      @keyframes reveal { to { clip-path: inset(0 0 0 0); } }
      .sub { font: 500 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#9b93a8; }
      .role { font: 600 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#d8d2e2; opacity:0; animation: cycle 9s infinite; }
      .role.r2 { animation-delay: 3s; } .role.r3 { animation-delay: 6s; }
      @keyframes cycle { 0%,4% {opacity:0} 8%,28% {opacity:1} 33%,100% {opacity:0} }
      .flow { fill:none; stroke-width:2; stroke-linecap:round; stroke-dasharray:4 10; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-28; } }
      .cap { font: 500 11.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#7d7490; }
      .tier { font: 600 11px 'SF Mono',Consolas,monospace; }
      .hitpulse { animation: hp 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes hp { 50% { transform: scale(1.12); } }
      .save { transform-box: fill-box; transform-origin: left center; animation: grow 2.6s ease-out 0.8s both; }
      @keyframes grow { from { transform: scaleX(0.05);} to { transform: scaleX(1);} }
      .esc { opacity:0; animation: escv 3.2s ease-in-out infinite; }
      .esc2 { opacity:0; animation: escv 3.2s ease-in-out 1.6s infinite; }
      @keyframes escv { 0% {opacity:0} 30% {opacity:1} 70% {opacity:1} 100% {opacity:0} }
    </style>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#bg)"/>
  <g stroke="#2a2536" stroke-width="1" opacity="0.5">
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="212" x2="900" y2="212"/>
  </g>

  <!-- left: identity -->
  <text class="sub" x="48" y="52">中山大学 · Sun Yat-sen University</text>
  <g class="type"><text class="name" x="48" y="118">Wu Manruo</text></g>
  <rect class="caret" x="352" y="84" width="3" height="40"/>
  <text class="role" x="48" y="152">高性能 × 成本效率的 Coding Agent 框架</text>
  <text class="role r2" x="48" y="152">prompt cache · semantic cache · cascade routing</text>
  <text class="role r3" x="48" y="152">token 预算 · 成本归因 · 可复现离线基准</text>
  <text class="sub" x="48" y="196" style="fill:#6f6680">frugent — 合成负载 · 植入最优解 · 虚构费率卡 · 全离线</text>

  <g font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600">
    <rect x="48" y="222" width="74" height="24" rx="12" fill="#241f2e" stroke="#3a3348"/>
    <text x="85" y="238" fill="#34d399" text-anchor="middle">Python</text>
    <rect x="130" y="222" width="74" height="24" rx="12" fill="#241f2e" stroke="#3a3348"/>
    <text x="167" y="238" fill="#fbbf24" text-anchor="middle">NumPy</text>
    <rect x="212" y="222" width="90" height="24" rx="12" fill="#241f2e" stroke="#3a3348"/>
    <text x="257" y="238" fill="#a78bfa" text-anchor="middle">PyTorch·CPU</text>
    <rect x="310" y="222" width="102" height="24" rx="12" fill="#241f2e" stroke="#3a3348"/>
    <text x="361" y="238" fill="#9b93a8" text-anchor="middle">offline-first</text>
  </g>

  <!-- right: cache-first cascade router -->
  <g>
    <!-- request inflow -->
    <path class="flow" stroke="#9b93a8" d="M470,140 H520"/>
    <!-- semantic cache block -->
    <rect x="520" y="112" width="86" height="56" rx="10" fill="#1c2b26" stroke="#34d399" stroke-width="1.6"/>
    <text class="tier" x="563" y="136" fill="#34d399" text-anchor="middle">cache</text>
    <text class="cap" x="563" y="154" text-anchor="middle" style="fill:#5eaa8d">hit → done</text>
    <circle class="hitpulse" cx="563" cy="112" r="4" fill="#34d399"/>
    <!-- miss path into cascade ladder -->
    <path class="flow" stroke="#6b6478" d="M606,140 H640" style="animation-delay:-0.5s"/>
    <!-- tier 1 (cheap, wide) -->
    <rect x="640" y="84" width="180" height="20" rx="10" fill="#241f2e" stroke="#3a3348"/>
    <rect class="save" x="642" y="86" width="150" height="16" rx="8" fill="#34d399" opacity="0.85"/>
    <text class="tier" x="648" y="76" fill="#34d399">tier-1 · cheap</text>
    <!-- tier 2 -->
    <rect x="668" y="130" width="120" height="18" rx="9" fill="#241f2e" stroke="#3a3348"/>
    <rect class="save" x="670" y="132" width="70" height="14" rx="7" fill="#fbbf24" opacity="0.85" style="animation-delay:1.2s"/>
    <text class="tier" x="672" y="124" fill="#fbbf24">tier-2</text>
    <!-- tier 3 (premium, narrow) -->
    <rect x="700" y="174" width="70" height="16" rx="8" fill="#241f2e" stroke="#3a3348"/>
    <rect class="save" x="702" y="176" width="34" height="12" rx="6" fill="#a78bfa" opacity="0.85" style="animation-delay:1.6s"/>
    <text class="tier" x="704" y="168" fill="#a78bfa">tier-3</text>
    <!-- escalation arrows (few requests climb) -->
    <path class="esc" d="M756,94 C 790,94 790,139 762,139" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="none"/>
    <path class="esc2" d="M744,148 C 776,150 776,180 748,181" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
    <text class="cap" x="800" y="120">质量门升级</text>
    <text class="cap" x="800" y="136" style="fill:#5c5468">仅少数请求</text>
    <!-- savings meter -->
    <text class="cap" x="640" y="222">measured savings（合成负载 · 虚构费率卡）</text>
    <rect x="640" y="230" width="180" height="10" rx="5" fill="#241f2e"/>
    <rect class="save" x="640" y="230" width="180" height="10" rx="5" fill="url(#savebar)" style="animation-delay:0.4s"/>
    <text class="cap" x="470" y="252">route cheap · cache hard · spend less</text>
  </g>
</svg>

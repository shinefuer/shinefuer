<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="frugent journey: from context store to cost reports">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16131c"/>
      <stop offset="1" stop-color="#1e1a28"/>
    </linearGradient>
    <style>
      .t   { font: 700 20px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#f5f3ef; }
      .tr  { font: 500 13px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#9b93a8; }
      .st  { font: 600 12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#e2dcec; text-anchor:middle; }
      .sd  { font: 500 10.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#8a8098; text-anchor:middle; }
      .pill{ font: 700 12.5px 'SF Mono',Consolas,monospace; }
      .conn { fill:none; stroke:#3a3348; stroke-width:2; stroke-dasharray:5 7; animation: dash 1.8s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-24; } }
      .node { opacity:0; animation: pop 0.45s ease-out forwards; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { from { opacity:0; transform: scale(0.4);} to { opacity:1; transform: scale(1);} }
      .lbl  { opacity:0; animation: fadein 0.5s ease-out forwards; }
      @keyframes fadein { to { opacity:1; } }
    </style>
  </defs>
  <rect width="900" height="340" rx="14" fill="url(#jbg)"/>

  <text class="t" x="40" y="44">frugent · 一个仓库的两年旅程</text>
  <text class="tr" x="40" y="66">成本效率 Coding Agent 运行时 — 让每个 token 都经过路由、缓存与预算的审视</text>
  <text class="tr" x="860" y="44" text-anchor="end" style="fill:#fbbf24">2025.01 — 2026.10</text>
  <text class="tr" x="860" y="66" text-anchor="end">523 commits · 330 in 2025</text>

  <path class="conn" d="M95,140 H770"/>
  <path class="conn" d="M790,140 C 830,140 830,236 790,236" style="animation-delay:-0.4s"/>
  <path class="conn" d="M770,236 H95" style="animation-delay:-0.8s"/>

  <!-- row 1 -->
  <g>
    <g class="node" style="animation-delay:0.2s"><circle cx="95" cy="140" r="16" fill="#241f2e" stroke="#34d399" stroke-width="2.5"/><path d="M88,135 h14 M88,140 h14 M88,145 h9" stroke="#34d399" stroke-width="2" stroke-linecap="round"/></g>
    <text class="st lbl" x="95" y="106" style="animation-delay:0.3s">上下文存储</text>
    <text class="sd lbl" x="95" y="180" style="animation-delay:0.3s">版本化 · 前缀树 · token 核算</text>

    <g class="node" style="animation-delay:0.5s"><circle cx="263" cy="140" r="16" fill="#241f2e" stroke="#fbbf24" stroke-width="2.5"/><path d="M256,140 l5,-6 v4 h8 v-4 l5,6 l-5,6 v-4 h-8 v4 z" fill="#fbbf24"/></g>
    <text class="st lbl" x="263" y="106" style="animation-delay:0.6s">缓存路由</text>
    <text class="sd lbl" x="263" y="180" style="animation-delay:0.6s">前缀感知 · 可证近优 · 语义缓存</text>

    <g class="node" style="animation-delay:0.8s"><circle cx="431" cy="140" r="16" fill="#241f2e" stroke="#a78bfa" stroke-width="2.5"/><path d="M424,145 q7,-14 14,0 M427,145 q4,-8 8,0" stroke="#a78bfa" stroke-width="2" fill="none"/></g>
    <text class="st lbl" x="431" y="106" style="animation-delay:0.9s">上下文压缩</text>
    <text class="sd lbl" x="431" y="180" style="animation-delay:0.9s">预算 knapsack · needle-recall</text>

    <g class="node" style="animation-delay:1.1s"><circle cx="599" cy="140" r="16" fill="#241f2e" stroke="#34d399" stroke-width="2.5"/><rect x="592" y="134" width="6" height="12" rx="1.5" fill="#34d399"/><rect x="600" y="134" width="6" height="12" rx="1.5" fill="none" stroke="#34d399" stroke-width="1.6"/></g>
    <text class="st lbl" x="599" y="106" style="animation-delay:1.2s">批处理去重</text>
    <text class="sd lbl" x="599" y="180" style="animation-delay:1.2s">single-flight · 结果等价性质</text>

    <g class="node" style="animation-delay:1.4s"><circle cx="770" cy="140" r="16" fill="#241f2e" stroke="#fbbf24" stroke-width="2.5"/><path d="M763,146 h14 M766,140 h8 M769,134 h2" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/></g>
    <text class="st lbl" x="770" y="106" style="animation-delay:1.5s">级联路由</text>
    <text class="sd lbl" x="770" y="180" style="animation-delay:1.5s">便宜先行 · DP 最优恢复</text>
  </g>

  <!-- row 2 -->
  <g>
    <g class="node" style="animation-delay:1.7s"><circle cx="686" cy="236" r="16" fill="#241f2e" stroke="#a78bfa" stroke-width="2.5"/><path d="M679,236 a7,7 0 1 1 14,0 a7,7 0 1 1 -14,0 M683,236 h6 M686,233 v6" stroke="#a78bfa" stroke-width="1.8" fill="none"/></g>
    <text class="st lbl" x="686" y="278" style="animation-delay:1.8s">硬预算调度</text>
    <text class="sd lbl" x="686" y="206" style="animation-delay:1.8s">永不超支性质 · 降级阶梯</text>

    <g class="node" style="animation-delay:2.0s"><circle cx="518" cy="236" r="16" fill="#241f2e" stroke="#34d399" stroke-width="2.5"/><path d="M511,242 v-6 M516,242 v-10 M521,242 v-4 M525,242 v-8" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/></g>
    <text class="st lbl" x="518" y="278" style="animation-delay:2.1s">成本归因</text>
    <text class="sd lbl" x="518" y="206" style="animation-delay:2.1s">span 树 · 守恒性质 · trace diff</text>

    <g class="node" style="animation-delay:2.3s"><circle cx="350" cy="236" r="16" fill="#241f2e" stroke="#fbbf24" stroke-width="2.5"/><rect x="343" y="230" width="14" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="2"/><path d="M346,236 h8" stroke="#fbbf24" stroke-width="1.6"/></g>
    <text class="st lbl" x="350" y="278" style="animation-delay:2.4s">沙箱执行器</text>
    <text class="sd lbl" x="350" y="206" style="animation-delay:2.4s">allowlist · 注入拒绝性质</text>

    <g class="node" style="animation-delay:2.6s"><circle cx="182" cy="236" r="16" fill="#241f2e" stroke="#a78bfa" stroke-width="2.5"/><path d="M175,241 l5,-9 l4,6 l6,-8" stroke="#a78bfa" stroke-width="2" fill="none"/></g>
    <text class="st lbl" x="182" y="278" style="animation-delay:2.7s">基准与报告</text>
    <text class="sd lbl" x="182" y="206" style="animation-delay:2.7s">植入最优解 · 确定性 SVG/HTML</text>
  </g>

  <g class="lbl" style="animation-delay:3.0s">
    <rect x="40" y="300" width="118" height="26" rx="13" fill="#241f2e" stroke="#3a3348"/><text class="pill" x="99" y="317" fill="#34d399" text-anchor="middle">523 commits</text>
    <rect x="170" y="300" width="112" height="26" rx="13" fill="#241f2e" stroke="#3a3348"/><text class="pill" x="226" y="317" fill="#fbbf24" text-anchor="middle">1280 tests</text>
    <rect x="294" y="300" width="118" height="26" rx="13" fill="#241f2e" stroke="#3a3348"/><text class="pill" x="353" y="317" fill="#a78bfa" text-anchor="middle">33 modules</text>
    <rect x="424" y="300" width="118" height="26" rx="13" fill="#241f2e" stroke="#3a3348"/><text class="pill" x="483" y="317" fill="#e2dcec" text-anchor="middle">4 examples</text>
    <rect x="554" y="300" width="86" height="26" rx="13" fill="#241f2e" stroke="#3a3348"/><text class="pill" x="597" y="317" fill="#e2dcec" text-anchor="middle">v0.1.2</text>
    <rect x="652" y="300" width="208" height="26" rx="13" fill="#241f2e" stroke="#3a3348"/><text class="pill" x="756" y="317" fill="#7ee081" text-anchor="middle">逐提交 build·test·format ✓</text>
  </g>
</svg>
